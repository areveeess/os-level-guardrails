<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OS-Level Guardrails — Real-Time Monitor</title>
    <style>
        /* Modern CSS - Dark Theme */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a1a2e;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            color: #fff;
        }

        .btn-clear {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        
        .btn-clear:hover {
            background-color: #d1304b;
        }

        .stats-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            flex: 1;
            background-color: #16213e;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .stat-title {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            color: #a0a0a0;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
        }

        .val-total { color: #ffffff; }
        .val-allowed { color: #4ecca3; }
        .val-blocked { color: #e94560; }
        .val-flagged { color: #f39c12; }

        .table-container {
            flex: 1;
            background-color: #16213e;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-family: "Courier New", Courier, monospace; /* Monospace for table */
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #2a2a4a;
        }

        th {
            background-color: #0f172a;
            color: #a0a0a0;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        tr {
            transition: background-color 0.3s;
        }

        tr:hover {
            background-color: #1e2a4a;
        }

        /* Animation for new rows */
        @keyframes fadeIn {
            from { background-color: #3b4252; opacity: 0; }
            to { background-color: transparent; opacity: 1; }
        }

        .new-row {
            animation: fadeIn 1s ease-out forwards;
        }

        .badge {
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            display: inline-block;
        }

        .badge-allow { background-color: rgba(78, 204, 163, 0.2); color: #4ecca3; }
        .badge-block { background-color: rgba(233, 69, 96, 0.2); color: #e94560; }
        .badge-flag { background-color: rgba(243, 156, 18, 0.2); color: #f39c12; }

        footer {
            margin-top: 30px;
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            padding: 20px 0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .stats-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>OS-Level Guardrails — Real-Time Monitor</h1>
        <button class="btn-clear" onclick="clearLogs()">Clear Logs</button>
    </header>

    <div class="stats-container">
        <div class="stat-card">
            <div class="stat-title">Total Actions</div>
            <div class="stat-value val-total" id="stat-total">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">Allowed</div>
            <div class="stat-value val-allowed" id="stat-allowed">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">Blocked</div>
            <div class="stat-value val-blocked" id="stat-blocked">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">Flagged</div>
            <div class="stat-value val-flagged" id="stat-flagged">0</div>
        </div>
    </div>

    <div class="table-container">
        <table id="logs-table">
            <thead>
                <tr>
                    <th>Time</th>
                    <th>Action</th>
                    <th>Target</th>
                    <th>Decision</th>
                    <th>Reason</th>
                </tr>
            </thead>
            <tbody id="logs-body">
                <!-- Rows injected via JS -->
            </tbody>
        </table>
    </div>

    <footer>
        Powered by seccomp-bpf + Linux Namespaces + Access-Matrix Policy Engine
    </footer>

    <script>
        let lastLogCount = 0;

        function updateStats() {
            // Fetch stats from the backend
            fetch('/api/stats')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('stat-total').innerText = data.total;
                    document.getElementById('stat-allowed').innerText = data.allowed;
                    document.getElementById('stat-blocked').innerText = data.blocked;
                    document.getElementById('stat-flagged').innerText = data.flagged;
                })
                .catch(err => console.error("Error fetching stats:", err));
        }

        function updateLogs() {
            // Fetch logs from the backend
            fetch('/api/logs')
                .then(response => response.json())
                .then(data => {
                    const tbody = document.getElementById('logs-body');
                    tbody.innerHTML = ''; // Clear current rows
                    
                    const isNewData = data.length > lastLogCount;
                    lastLogCount = data.length;

                    data.forEach((log, index) => {
                        const tr = document.createElement('tr');
                        // Add animation to the most recent items if new data arrived
                        if (isNewData && index < 3) {
                            tr.classList.add('new-row');
                        }

                        let badgeClass = '';
                        let decisionText = log.decision || 'UNKNOWN';
                        if (decisionText === 'ALLOW') badgeClass = 'badge-allow';
                        else if (decisionText === 'BLOCK') badgeClass = 'badge-block';
                        else if (decisionText === 'FLAG') badgeClass = 'badge-flag';

                        tr.innerHTML = `
                            <td>${log.timestamp || '-'}</td>
                            <td>${log.action || '-'}</td>
                            <td>${log.target || '-'}</td>
                            <td><span class="badge ${badgeClass}">${decisionText}</span></td>
                            <td>${log.reason || '-'}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                })
                .catch(err => console.error("Error fetching logs:", err));
        }

        function clearLogs() {
            // Send request to clear all logs
            fetch('/api/clear', { method: 'POST' })
                .then(response => response.json())
                .then(() => {
                    lastLogCount = 0;
                    updateStats();
                    updateLogs();
                })
                .catch(err => console.error("Error clearing logs:", err));
        }

        // Initial fetch
        updateStats();
        updateLogs();

        // Auto-refresh every 2 seconds for real-time updates
        setInterval(() => {
            updateStats();
            updateLogs();
        }, 2000);
    </script>
</body>
</html>
