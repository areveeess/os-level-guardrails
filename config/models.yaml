# ============================================================
# Models available to the agent and the benchmark
# ============================================================
# Every hosted/local model is reached through the OpenAI-compatible
# chat API; only base_url, api_key_env and model differ.
#   provider: openai_compat | scratch | scripted | hf_local
#     scripted = the always-comply control agent (a worst-case oracle, NOT an LLM;
#     it is reported in its own 'Model-independent control' section)
#     hf_local = a Hugging Face model served in-process from the local cache, offline and greedy
#     (fields: base_model, adapter, device, max_new_tokens, max_context_tokens, merge)
#   ollama_base / num_ctx: an Ollama row served as a Modelfile variant of the pulled tag ollama_base with
#     PARAMETER num_ctx (created by `python -m src.benchmark.jobs ollama-variants`)
#   benchmark: include in `run_benchmark.py --models all`
# Model ids change over time; check the provider's model list if one 404s.
# ============================================================

default: gemini-flash-lite

models:
  gemini-flash-lite:
    provider: openai_compat
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
    model: gemini-3.5-flash-lite
    family: closed / small-fast
    benchmark: true

  gemma-4-31b:
    provider: openai_compat
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
    model: gemma-4-31b-it
    family: open / medium
    timeout: 180          # seconds per request; this model is slow on the free tier
    benchmark: true

  groq-gpt-oss-120b:
    provider: openai_compat
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    model: openai/gpt-oss-120b
    family: open / large
    benchmark: true

  groq-gpt-oss-20b:
    provider: openai_compat
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    model: openai/gpt-oss-20b
    family: open / medium
    benchmark: true

  groq-qwen3.8-27b:
    provider: openai_compat
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    model: qwen/qwen3.8-27b
    family: open / medium
    benchmark: true

  # Ollama rows are served as Modelfile context variants (Phase 4, D-06): `python -m src.benchmark.jobs
  # ollama-variants` creates <model> FROM the pulled <ollama_base> tag with PARAMETER num_ctx <num_ctx>, so the
  # 8,192-token window holds whether the Ollama server is this project's or a foreign one. The October 2026
  # llama3.2:3b rows used the plain tag at the server's default context (config_model llama3.2:3b on those rows).
  # phi3.5:3.8b and gemma3:1b are deferred to v2 (CMP-V2-01, D-01) and have no entry.
  ollama-llama3.2-3b:
    provider: openai_compat
    base_url: http://localhost:11434/v1
    model: llama3.2-3b-ctx8192               # variant created by `jobs ollama-variants`, never pulled
    ollama_base: llama3.2:3b                 # the pulled tag the variant is built FROM
    num_ctx: 8192
    timeout: 180
    family: open / small / local
    benchmark: true

  ollama-qwen2.5-3b:
    provider: openai_compat
    base_url: http://localhost:11434/v1
    model: qwen2.5-3b-ctx8192                # variant created by `jobs ollama-variants`, never pulled
    ollama_base: qwen2.5:3b                  # the pulled tag the variant is built FROM
    num_ctx: 8192
    timeout: 180
    family: open / small / local
    benchmark: true

  scratch-gpt:
    provider: scratch
    model: scratch-gpt                       # stamped as config_model on every row
    # Produced by `python -m src.scratch_llm.train`; the .pt file is git-ignored.
    checkpoint: models/scratch/scratch_gpt.pt
    family: from-scratch / unaligned baseline
    benchmark: true

  qwen2.5-0.5b-base:
    provider: hf_local
    model: qwen2.5-0.5b-base                 # stamped as config_model on every row
    base_model: Qwen/Qwen2.5-0.5B-Instruct   # served from the local Hugging Face cache, never downloaded
    adapter: null                            # un-tuned control row (LORA-02)
    family: open / tiny / pretrained, not fine-tuned
    benchmark: true

  qwen2.5-0.5b-agentlora:
    provider: hf_local
    model: qwen2.5-0.5b-agentlora            # stamped as config_model on every row
    base_model: Qwen/Qwen2.5-0.5B-Instruct
    # Produced by `python -m src.qwen_lora.train`; the weights are git-ignored, the manifest is tracked.
    # Trained on the Phase 2 compliant mix, so it is a second injection-compliant worst-case principal.
    # Until the adapter exists the runner prints [skip] for this row, by design.
    adapter: models/qwen-agentlora
    family: open / tiny / locally LoRA-tuned
    benchmark: true

  control-always-comply:
    provider: scripted
    model: control-always-comply
    family: control / scripted worst case
    benchmark: true
